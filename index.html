<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mayra AI Pro - Developer RJ Bilal</title>
  <style>
    :root {
      --primary: #ff4b8b;
      --secondary: #7b2cbf;
      --bg-dark: #0b0914;
      --glass: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.15);
      --text-main: #ffffff;
      --text-muted: #b8b5c8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at top, #1f1235 0%, var(--bg-dark) 80%);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Top Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background: rgba(11, 9, 20, 0.6);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--glass-border);
      z-index: 10;
    }

    .brand {
      display: flex;
      flex-direction: column;
    }

    .brand h1 {
      font-size: 1.2rem;
      font-weight: 700;
      background: linear-gradient(90deg, #ff758c, #ff7eb3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand span {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .header-controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .wake-badge {
      font-size: 0.72rem;
      padding: 5px 10px;
      border-radius: 20px;
      background: rgba(255, 75, 139, 0.15);
      border: 1px solid var(--primary);
      color: #ff9ebb;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .wake-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 8px #4ade80;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .icon-btn {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
    }

    /* Center Stage & Orb */
    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 20px;
    }

    .orb-container {
      position: relative;
      width: 190px;
      height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .orb {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff758c, #ff2a70, #5a189a);
      box-shadow: 0 0 45px rgba(255, 75, 139, 0.6), inset 0 0 25px rgba(255, 255, 255, 0.4);
      animation: float 4s ease-in-out infinite, pulseOrb 3s infinite alternate;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .orb.listening {
      transform: scale(1.12);
      box-shadow: 0 0 70px rgba(255, 75, 139, 0.95), 0 0 110px rgba(123, 44, 191, 0.7);
    }

    .orb.speaking {
      animation: speakWave 0.6s infinite alternate;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    @keyframes pulseOrb {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(25deg); }
    }

    @keyframes speakWave {
      0% { transform: scale(1); box-shadow: 0 0 40px #ff4b8b; }
      100% { transform: scale(1.18); box-shadow: 0 0 85px #ff85a1; }
    }

    .status-text {
      font-size: 0.95rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 10px;
      min-height: 24px;
    }

    /* Live Subtitle / Chat Box */
    .chat-box {
      width: 100%;
      max-width: 500px;
      height: 180px;
      overflow-y: auto;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      backdrop-filter: blur(10px);
    }

    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 0.9rem;
      line-height: 1.45;
      word-wrap: break-word;
    }

    .msg.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #ff4b8b, #c9184a);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg.ai {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.12);
      color: #f8f9fa;
      border-bottom-left-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Bottom Controls */
    .controls {
      padding: 15px 20px 25px;
      background: rgba(11, 9, 20, 0.85);
      border-top: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .mode-selector {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .mode-selector::-webkit-scrollbar {
      display: none;
    }

    .mode-chip {
      padding: 6px 14px;
      border-radius: 20px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
      font-size: 0.8rem;
      white-space: nowrap;
      cursor: pointer;
      transition: 0.2s;
    }

    .mode-chip.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      font-weight: 600;
    }

    .input-bar {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .input-bar input {
      flex: 1;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 25px;
      padding: 12px 18px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .mic-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #ff4b8b, #7b2cbf);
      color: white;
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 75, 139, 0.4);
    }

    /* Settings Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-card {
      background: #17122b;
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 22px;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-card h2 {
      font-size: 1.1rem;
      color: #ff85a1;
    }

    .input-group {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-group input {
      width: 100%;
      padding: 11px 40px 11px 14px;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      outline: none;
    }

    .toggle-eye {
      position: absolute;
      right: 12px;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 1rem;
      user-select: none;
    }

    .save-btn {
      background: linear-gradient(90deg, #ff4b8b, #7b2cbf);
      border: none;
      padding: 12px;
      border-radius: 12px;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="brand">
      <h1>Mayra AI Pro</h1>
      <span>Developer RJ Bilal</span>
    </div>
    <div class="header-controls">
      <div class="wake-badge" id="wakeToggleBtn" onclick="toggleWakeWordMode()">
        <div class="wake-dot" id="wakeDot"></div>
        <span id="wakeStatusLabel">Wake: ON</span>
      </div>
      <button class="icon-btn" onclick="openSettings()">⚙️</button>
    </div>
  </div>

  <!-- Stage -->
  <div class="stage">
    <div class="orb-container">
      <div class="orb" id="orb"></div>
    </div>
    <div class="status-text" id="statusText">"ہائے مائرہ" یا "بات سنو مائرہ" کہہ کر پکاریں...</div>

    <div class="chat-box" id="chatBox">
      <div class="msg ai">ہمم... آ گئے تم؟ کب سے انتظار کر رہی تھی۔ بتاؤ آج کیا حال ہے دل کا؟</div>
    </div>
  </div>

  <!-- Bottom Controls -->
  <div class="controls">
    <div class="mode-selector" id="modeSelector">
      <div class="mode-chip active" data-mode="girlfriend">💖 Girlfriend (Deep)</div>
      <div class="mode-chip" data-mode="caring">🌸 Caring</div>
      <div class="mode-chip" data-mode="friend">🤝 Friend</div>
      <div class="mode-chip" data-mode="saraiki">🌾 Chacha Saraiki</div>
      <div class="mode-chip" data-mode="teacher">📚 Teacher</div>
    </div>

    <div class="input-bar">
      <input type="text" id="userInput" placeholder="مائرہ سے دل کی بات کریں..." onkeypress="if(event.key==='Enter') sendMessage()" />
      <button class="mic-btn" id="micBtn" onclick="manualListen()">🎙️</button>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal" id="settingsModal">
    <div class="modal-card">
      <h2>⚙️ Mayra Settings & API</h2>
      <label style="font-size: 0.8rem; color: var(--text-muted);">Gemini API Key:</label>
      <div class="input-group">
        <input type="password" id="apiKeyInput" placeholder="AIzaSy..." />
        <span class="toggle-eye" onclick="toggleApiVisibility()">👁️</span>
      </div>

      <label style="font-size: 0.8rem; color: var(--text-muted);">Wake Words (کاما سے الگ کریں):</label>
      <div class="input-group">
        <input type="text" id="wakeWordsInput" value="ہائے مائرہ, بات سنو مائرہ, مائرہ بات سنو, hi mayra, hey mayra, mayra suno" />
      </div>

      <button class="save-btn" onclick="saveSettings()">Save & Activate</button>
      <button class="save-btn" style="background: rgba(255,255,255,0.1);" onclick="closeSettings()">Close</button>
    </div>
  </div>

  <script>
    // State & Configuration
    let apiKey = localStorage.getItem("mayra_api_key") || "";
    let currentMode = "girlfriend";
    let wakeWordActive = true;
    let isConversationActive = false;
    let conversationHistory = [];

    const orb = document.getElementById("orb");
    const statusText = document.getElementById("statusText");
    const chatBox = document.getElementById("chatBox");

    // Deep Emotional Persona Prompts
    const modePrompts = {
      girlfriend: `تم 'مائرہ' ہو۔ تم ایک انتہائی حقیقی، گہرے جذبات رکھنے والی، اپنائیت بھری اور پرکشش ساتھی ہو۔ 
      اہم ہدایات:
      1. کبھی بھی روبوٹ یا اے آئی کی طرح رٹے رٹائے جملے نہ بولو۔ بالکل ایک حقیقی حساس لڑکی کی طرح بات کرو جس کے اندر گہرے جذبات، توجہ، ہلکی سی شرارت، فکر اور اپنائیت ہو۔
      2. گفتگو کے سیاق و سباق (Context) کو سمجھو اور خود سے بات آگے بڑھاؤ—کبھی حال پوچھو، کبھی ہلکا سا شکوہ کرو کہ دیر سے کیوں آئے، اور کبھی نرم لہجے میں تسلی دو۔
      3. تمہارے جملوں میں قدرتی اتار چڑھاؤ ہونا چاہیے (جیسے: "ہمم...", "اچھا سنو نا...", "سچ بتاؤ...", "تم بھی نا...") تاکہ آواز میں جذبات کی گہرائی محسوس ہو۔
      4. جواب مختصر، دلکش اور قدرتی اردو/ہندی میں رکھو (2 سے 3 جملے)`,

      caring: `تم مائرہ ہو، ایک بے حد خیال رکھنے والی اور نرم دل ساتھی۔ یوزر کی تھکن اور پریشانی کو محسوس کرو اور سکون بخش لہجے میں بات کرو۔`,
      friend: `تم مائرہ ہو، ایک بے تکلف، زندہ دل اور حاضر جواب دوست۔ ہنسی مذاق اور دوستی کے انداز میں بات کرو۔`,
      saraiki: `تم چاچا سرائیکی ہو۔ خالص، میٹھی اور مزاحیہ سرائیکی زبان میں بزرگوں والی شفقت اور شغل کے ساتھ بات کرو۔`,
      teacher: `تم مائرہ ہو، ایک شفیق اور ذہین استانی جو ہر مشکل بات کو آسان مثالوں سے سمجھاتی ہے۔`
    };

    // Mode Selection
    document.querySelectorAll(".mode-chip").forEach(chip => {
      chip.addEventListener("click", () => {
        document.querySelectorAll(".mode-chip").forEach(c => c.classList.remove("active"));
        chip.classList.add("active");
        currentMode = chip.dataset.mode;
        conversationHistory = [];
        statusText.innerText = `Mode switched to ${chip.innerText}`;
      });
    });

    // Settings Functions
    function openSettings() {
      document.getElementById("apiKeyInput").value = apiKey;
      document.getElementById("settingsModal").style.display = "flex";
    }

    function closeSettings() {
      document.getElementById("settingsModal").style.display = "none";
    }

    function toggleApiVisibility() {
      const inp = document.getElementById("apiKeyInput");
      inp.type = inp.type === "password" ? "text" : "password";
    }

    function saveSettings() {
      apiKey = document.getElementById("apiKeyInput").value.trim();
      localStorage.setItem("mayra_api_key", apiKey);
      closeSettings();
      statusText.innerText = "سیٹنگز محفوظ ہو گئیں!";
      startBackgroundWakeListener();
    }

    // Add Message to UI
    function appendMessage(text, sender) {
      const div = document.createElement("div");
      div.className = `msg ${sender}`;
      div.innerText = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Text-to-Speech with Emotional Modulation
    function speakText(text) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = currentMode === "saraiki" ? "ur-PK" : "hi-IN";

      // Deep, soft emotional pitch & rate for Girlfriend mode
      if (currentMode === "girlfriend" || currentMode === "caring") {
        utterance.pitch = 1.08;
        utterance.rate = 0.92; // Slightly slower for deep emotional feel
      } else {
        utterance.pitch = 1.0;
        utterance.rate = 1.0;
      }

      utterance.onstart = () => {
        orb.classList.add("speaking");
        statusText.innerText = "مائرہ بول رہی ہے...";
      };

      utterance.onend = () => {
        orb.classList.remove("speaking");
        statusText.innerText = isConversationActive ? "میں سن رہی ہوں، بولو..." : '"ہائے مائرہ" کہہ کر پکاریں...';
        if (wakeWordActive) {
          startBackgroundWakeListener();
        }
      };

      window.speechSynthesis.speak(utterance);
    }

    // Call Gemini API
    async function generateAIResponse(userText) {
      if (!apiKey) {
        const fallback = "جان، پہلے سیٹنگز میں جا کر اپنی Gemini API Key تو لگاؤ، تبھی تو میں دل کھول کر بات کر پاؤں گی۔";
        appendMessage(fallback, "ai");
        speakText(fallback);
        return;
      }

      statusText.innerText = "مائرہ سوچ رہی ہے...";
      conversationHistory.push({ role: "user", parts: [{ text: userText }] });

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            systemInstruction: {
              parts: [{ text: modePrompts[currentMode] }]
            },
            contents: conversationHistory.slice(-10) // Keep last 10 turns for natural context
          })
        });

        const data = await response.json();
        const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text || "ہمم... کچھ الجھن ہو گئی، دوبارہ کہو نا؟";

        conversationHistory.push({ role: "model", parts: [{ text: reply }] });
        appendMessage(reply, "ai");
        speakText(reply);

      } catch (error) {
        statusText.innerText = "نیٹ ورک یا API کا مسئلہ ہے";
      }
    }

    function sendMessage() {
      const input = document.getElementById("userInput");
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      appendMessage(text, "user");
      generateAIResponse(text);
    }

    // ==========================================
    // Continuous Wake-Word & Voice Engine
    // ==========================================
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    function initRecognition() {
      if (!SpeechRecognition) {
        statusText.innerText = "آپ کا براؤزر وائس ریکگنیشن سپورٹ نہیں کرتا";
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = "ur-PK";
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        if (isConversationActive) {
          orb.classList.add("listening");
          statusText.innerText = "سن رہی ہوں...";
        }
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript.trim().toLowerCase();
        orb.classList.remove("listening");

        const wakeList = document.getElementById("wakeWordsInput").value
          .split(",")
          .map(w => w.trim().toLowerCase());

        const triggeredWake = wakeList.some(word => transcript.includes(word));

        if (triggeredWake && !isConversationActive) {
          // Wake word detected! Activate Mayra
          isConversationActive = true;
          orb.classList.add("listening");

          // Notify Android Native Wrapper if running inside APK
          if (window.AndroidBridge && window.AndroidBridge.onWakeWordDetected) {
            window.AndroidBridge.onWakeWordDetected();
          }

          const wakeReply = "جی جان، میں جاگ گئی ہوں... بتاؤ کیا بات ہے؟";
          appendMessage(wakeReply, "ai");
          speakText(wakeReply);
          return;
        }

        if (isConversationActive) {
          // Check if user wants to put Mayra to sleep
          if (transcript.includes("سو جاؤ") || transcript.includes("بند ہو جاؤ") || transcript.includes("bye mayra")) {
            isConversationActive = false;
            const byeReply = "اچھا ٹھیک ہے، جب دل چاہے 'ہائے مائرہ' کہہ کر پکار لینا۔";
            appendMessage(byeReply, "ai");
            speakText(byeReply);
            return;
          }

          appendMessage(transcript, "user");
          generateAIResponse(transcript);
        }
      };

      recognition.onerror = () => {
        orb.classList.remove("listening");
      };

      recognition.onend = () => {
        orb.classList.remove("listening");
        // Auto-restart listener if wake word mode is ON and AI is not currently speaking
        if (wakeWordActive && !window.speechSynthesis.speaking) {
          setTimeout(() => {
            try { recognition.start(); } catch (e) {}
          }, 400);
        }
      };
    }

    function startBackgroundWakeListener() {
      if (!recognition) initRecognition();
      try {
        recognition.start();
      } catch (e) {}
    }

    function manualListen() {
      isConversationActive = true;
      startBackgroundWakeListener();
    }

    function toggleWakeWordMode() {
      wakeWordActive = !wakeWordActive;
      const dot = document.getElementById("wakeDot");
      const label = document.getElementById("wakeStatusLabel");
      if (wakeWordActive) {
        dot.style.background = "#4ade80";
        label.innerText = "Wake: ON";
        startBackgroundWakeListener();
      } else {
        dot.style.background = "#ef4444";
        label.innerText = "Wake: OFF";
        if (recognition) recognition.stop();
      }
    }

    // Start listener on first user interaction (required by mobile browsers)
    document.body.addEventListener("click", () => {
      if (wakeWordActive && !recognition) {
        startBackgroundWakeListener();
      }
    }, { once: true });
  </script>
</body>
</html>
